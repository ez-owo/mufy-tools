<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUFY Token统计器</title><style>:root{color-scheme:dark;--bg:#0d1620;--panel:#13212d;--panel2:#172938;--input:#101d28;--line:#30495a;--line2:#223846;--text:#d2dde3;--muted:#8ea0aa;--sky:#79c7ef;--sky-soft:rgba(121,199,239,.12);--sky-line:rgba(121,199,239,.42);--green:#88cba2;--green-soft:rgba(136,203,162,.11);--green-line:rgba(136,203,162,.42);--gold:#e7c36b;--danger:#df8b91;--danger-soft:rgba(223,139,145,.10);--danger-line:rgba(223,139,145,.42);font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-width:320px;margin:0;padding:112px 24px 44px;background:radial-gradient(circle at 8% -8%,rgba(121,199,239,.055),transparent 30%),radial-gradient(circle at 95% 0,rgba(136,203,162,.028),transparent 28%),var(--bg);font-size:15px}button,textarea{font:inherit}button{cursor:pointer}.topbar{position:fixed;z-index:50;top:0;left:0;right:0;border-bottom:1px solid var(--line);background:rgba(13,22,32,.96);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.2)}.topbar-inner{display:flex;align-items:center;gap:14px;width:min(1240px,calc(100% - 40px));min-height:88px;margin:0 auto;padding:10px 0}.brand{min-width:190px;flex:1 1 auto}.brand-title{color:var(--gold);font-size:20px;font-weight:800;letter-spacing:.02em}.home-link{display:inline-block;margin-top:5px;color:var(--muted);font-size:12px;text-decoration:none}.home-link:hover{color:var(--sky)}.meter{width:min(270px,23vw);min-width:170px;flex:0 1 270px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.meter-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.meter-label{color:var(--muted);font-size:13px}.meter-value{color:var(--green);font:800 20px/1.15 Consolas,"SFMono-Regular",monospace}.meter-limit,.meter-percent{color:var(--muted);font-size:13px}.meter-track{width:min(100%,22vw);max-width:250px;height:6px;margin-top:8px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.06)}.meter-track span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--sky),var(--green));transition:width .15s ease}.meter.is-over{border-color:var(--danger-line);background:linear-gradient(180deg,var(--panel),var(--danger-soft))}.meter.is-over .meter-value{color:var(--danger)}.meter.is-over .meter-track span{background:linear-gradient(90deg,var(--gold),var(--danger))}.shell{width:min(1180px,100%);margin:0 auto}.status-row{display:flex;justify-content:flex-end;margin:0 2px 14px;color:var(--muted);font-size:13px}.editor-list{display:grid;gap:18px}.editor-card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.editor-card:focus-within{border-color:var(--sky-line);box-shadow:0 0 0 1px rgba(121,199,239,.08)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;border-bottom:1px solid var(--line2);background:var(--panel2);user-select:none}.card-head:hover{background:#1a2e3e}.card-left{display:flex;min-width:0;align-items:center;gap:9px}.collapse-btn{display:flex;min-width:0;align-items:center;gap:9px;padding:0;border:0;background:transparent;color:var(--text);font-weight:750;text-align:left}.collapse-icon{display:inline-block;width:16px;color:var(--sky);font-size:14px;transition:transform .15s ease}.card-title{font-size:16px}.copy-btn{flex:0 0 auto;padding:5px 10px;border:1px solid var(--sky-line);border-radius:7px;background:var(--sky-soft);color:var(--sky);font-size:14px}.copy-btn:hover{border-color:var(--sky);background:rgba(121,199,239,.18)}.copy-btn.is-done{border-color:var(--green-line);background:var(--green-soft);color:var(--green)}.section-token{flex:0 0 auto;min-width:64px;padding:5px 9px;border:1px solid var(--green-line);border-radius:999px;background:var(--green-soft);color:var(--green);font:800 13px/1.25 Consolas,monospace;text-align:center}.section-token.is-over{border-color:var(--danger-line);background:var(--danger-soft);color:var(--danger)}.card-body{padding:14px 16px 17px}.editor{display:block;width:100%;height:320px;min-height:170px;padding:14px 15px;resize:vertical;border:1px solid var(--line2);border-radius:9px;outline:0;background:var(--input);color:#cbd7dd;font-size:15px;line-height:1.72;tab-size:2}.editor:focus{border-color:var(--sky-line)}.editor::placeholder{color:#6f8591}.editor.opening{height:280px}.editor-card.is-collapsed .card-head{border-bottom:0}.editor-card.is-collapsed .card-body{display:none}.editor-card.is-collapsed .collapse-icon{transform:rotate(-90deg)}.footer{margin-top:36px;padding:20px 6px 2px;border-top:1px solid var(--line2);color:var(--muted);font-size:13px;line-height:1.7;text-align:center}.footer-note{margin-top:8px;color:#a9b7bf}.notice{position:fixed;z-index:80;right:18px;bottom:18px;max-width:min(380px,calc(100vw - 36px));padding:10px 13px;border:1px solid var(--green-line);border-radius:9px;background:#14271f;color:var(--green);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease}.notice.show{opacity:1;transform:none}@media(max-width:760px){body{padding:158px 24px 40px}.topbar-inner{align-items:flex-start;flex-wrap:wrap;width:calc(100% - 28px);min-height:0;gap:8px 10px;padding:10px 0}.brand{flex:1 0 100%;min-width:0}.brand-title{font-size:18px}.meter{width:min(42vw,220px);min-width:0;flex:1 1 42vw;padding:8px 10px}.meter-value{font-size:17px}.meter-label,.meter-limit,.meter-percent{font-size:12px}.meter-track{width:min(100%,38vw);max-width:190px}.status-row{margin-bottom:18px;font-size:12px}.editor-list{gap:20px}.card-head{padding:12px 13px}.card-left{gap:7px}.card-title{font-size:15px}.copy-btn{font-size:13px}.section-token{min-width:56px;font-size:12px}.card-body{padding:18px 16px 20px}.editor{height:285px;padding:14px;font-size:15px}.editor.opening{height:250px}.footer{margin-top:30px;padding-top:18px;font-size:12px}}</style></head><body><div class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-title">MUFY Token统计器</div><a class="home-link" href="index.html">← 返回 MUFY Tools</a></div><div id="coreMeter" class="meter"><div class="meter-head"><div><div class="meter-label">核心五项</div><div><strong id="coreValue" class="meter-value">0</strong> <span class="meter-limit">/ 20,000 token</span></div></div><span id="corePercent" class="meter-percent">0%</span></div><div class="meter-track"><span id="coreProgress"></span></div></div><div id="openingMeter" class="meter"><div class="meter-head"><div><div class="meter-label">开场设计</div><div><strong id="openingValue" class="meter-value">0</strong> <span class="meter-limit">/ 3,000 token</span></div></div><span id="openingPercent" class="meter-percent">0%</span></div><div class="meter-track"><span id="openingProgress"></span></div></div></div></div><main class="shell"><div class="status-row"><span id="tokenizerState">备用预估（有误差）</span></div><div id="editorList" class="editor-list"></div><footer class="footer"><div>Tokenizer：o200k_base · gpt-tokenizer（MIT，© 2023–2024 Bazyli Brzoska） · 工具制作：@ez-owo</div><div class="footer-note">本工具允许二传、二改，转载或修改后发布时请保留上方署名（含 @ez-owo）。</div></footer></main><div id="notice" class="notice"></div><script>const SECTION_SPECS=[{key:"character",name:"角色设定",group:"core",placeholder:"粘贴角色设定内容…"},{key:"adversity",name:"逆境处理",group:"core",placeholder:"粘贴逆境处理内容…"},{key:"opening",name:"开场设计",group:"opening",placeholder:"粘贴开场设计内容…"},{key:"plot",name:"情节设定",group:"core",placeholder:"粘贴情节设定内容…"},{key:"output",name:"输出设定",group:"core",placeholder:"粘贴输出设定内容…"},{key:"style",name:"样例对话 & 文风",group:"core",placeholder:"粘贴样例对话与文风内容…"}];const values=new Map(SECTION_SPECS.map(item=>[item.key,""]));const editorList=document.getElementById("editorList");const coreMeter=document.getElementById("coreMeter"),coreValue=document.getElementById("coreValue"),corePercent=document.getElementById("corePercent"),coreProgress=document.getElementById("coreProgress");const openingMeter=document.getElementById("openingMeter"),openingValue=document.getElementById("openingValue"),openingPercent=document.getElementById("openingPercent"),openingProgress=document.getElementById("openingProgress");const tokenizerState=document.getElementById("tokenizerState"),notice=document.getElementById("notice");let noticeTimer=0;function estimateToken(text){if(!text)return 0;const normalized=String(text).replace(/\r\n?/g,"\n");const tokenizer=window.GPTTokenizer_o200k_base;if(tokenizer){if(typeof tokenizer.countTokens==="function")return tokenizer.countTokens(normalized);if(typeof tokenizer.encode==="function")return tokenizer.encode(normalized).length}let chinese=0,letterDigit=0,other=0;for(const ch of normalized){const code=ch.codePointAt(0);if((code>=0x4E00&&code<=0x9FFF)||(code>=0x3400&&code<=0x4DBF))chinese++;else if(/[a-zA-Z0-9]/.test(ch))letterDigit++;else other++}return Math.round(chinese*.823+letterDigit*.241+other*.673)}function setNotice(text){clearTimeout(noticeTimer);notice.textContent=text;notice.classList.add("show");noticeTimer=setTimeout(()=>notice.classList.remove("show"),1800)}async function copyText(text,label,button){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const box=document.createElement("textarea");box.value=text;box.style.cssText="position:fixed;opacity:0;pointer-events:none";document.body.appendChild(box);box.select();if(!document.execCommand("copy"))throw new Error("copy failed");box.remove()}button.classList.add("is-done");button.textContent="已复制";setTimeout(()=>{button.classList.remove("is-done");button.textContent="复制"},1000);setNotice("✓ 已复制："+label)}catch(e){setNotice("复制失败，请手动复制。")}}function updateMeter(meter,valueNode,percentNode,progressNode,total,limit){const percent=total/limit*100;valueNode.textContent=total.toLocaleString("zh-CN");percentNode.textContent=(Math.round(percent*10)/10)+"%";progressNode.style.width=Math.min(100,percent)+"%";meter.classList.toggle("is-over",total>limit)}function refreshAll(){let core=0,opening=0;SECTION_SPECS.forEach(spec=>{const total=estimateToken(values.get(spec.key)||"");const badge=document.querySelector('[data-token-key="'+spec.key+'"]');if(badge){badge.textContent=total.toLocaleString("zh-CN");badge.classList.toggle("is-over",spec.group==="opening"&&total>3000)}if(spec.group==="core")core+=total;else opening+=total});updateMeter(coreMeter,coreValue,corePercent,coreProgress,core,20000);updateMeter(openingMeter,openingValue,openingPercent,openingProgress,opening,3000)}function renderEditors(){const frag=document.createDocumentFragment();SECTION_SPECS.forEach(spec=>{const card=document.createElement("div");card.className="editor-card is-collapsed";const head=document.createElement("div");head.className="card-head";const left=document.createElement("div");left.className="card-left";const collapse=document.createElement("button");collapse.className="collapse-btn";collapse.type="button";collapse.setAttribute("aria-expanded","false");const icon=document.createElement("span");icon.className="collapse-icon";icon.textContent="▾";const title=document.createElement("span");title.className="card-title";title.textContent=spec.name;collapse.append(icon,title);const copy=document.createElement("button");copy.className="copy-btn";copy.type="button";copy.textContent="复制";const token=document.createElement("span");token.className="section-token";token.dataset.tokenKey=spec.key;token.textContent="0";left.append(collapse,copy);head.append(left,token);const body=document.createElement("div");body.className="card-body";const textarea=document.createElement("textarea");textarea.className="editor"+(spec.group==="opening"?" opening":"");textarea.placeholder=spec.placeholder;textarea.spellcheck=false;textarea.setAttribute("aria-label",spec.name);textarea.addEventListener("input",()=>{values.set(spec.key,textarea.value);refreshAll()});copy.addEventListener("click",event=>{event.stopPropagation();copyText(textarea.value,spec.name,copy)});collapse.addEventListener("click",()=>{const collapsed=card.classList.toggle("is-collapsed");collapse.setAttribute("aria-expanded",String(!collapsed))});head.addEventListener("click",event=>{if(event.target.closest("button"))return;collapse.click()});body.appendChild(textarea);card.append(head,body);frag.appendChild(card)});editorList.appendChild(frag);refreshAll()}function loadTokenizer(){const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/gpt-tokenizer@3.4.0/dist/o200k_base.js";script.async=true;script.onload=()=>{tokenizerState.textContent=window.GPTTokenizer_o200k_base?"o200k_base（精确）":"备用预估（有误差）";refreshAll()};script.onerror=()=>{tokenizerState.textContent="备用预估（有误差）"};document.head.appendChild(script)}renderEditors();loadTokenizer();</script></body></html>
