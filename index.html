<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUFY Tools</title>
<style>
:root{color-scheme:dark;--bg:#0d1620;--panel:#13212d;--panel2:#172938;--line:#30495a;--line2:#223846;--text:#d2dde3;--muted:#8ea0aa;--sky:#79c7ef;--green:#88cba2;--gold:#e7c36b;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}*{box-sizing:border-box}body{min-width:320px;margin:0;background:radial-gradient(circle at 10% -10%,rgba(121,199,239,.08),transparent 34%),radial-gradient(circle at 95% 0,rgba(136,203,162,.05),transparent 30%),var(--bg);color:var(--text)}.shell{width:min(1000px,calc(100% - 40px));margin:0 auto;padding:70px 0 46px}.hero{padding:34px 0 30px;border-bottom:1px solid var(--line2)}.eyebrow{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.16em}.hero h1{margin:8px 0 9px;color:#e6edf1;font-size:34px;line-height:1.2}.hero p{max-width:640px;margin:0;color:var(--muted);font-size:15px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}.card{display:flex;min-height:190px;flex-direction:column;padding:23px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(155deg,var(--panel2),var(--panel));color:inherit;text-decoration:none;box-shadow:0 14px 34px rgba(0,0,0,.15);transition:.16s ease}.card:hover{transform:translateY(-2px);border-color:rgba(121,199,239,.55)}.tag{align-self:flex-start;padding:4px 8px;border:1px solid rgba(121,199,239,.32);border-radius:999px;background:rgba(121,199,239,.08);color:var(--sky);font-size:12px}.card.settings .tag{border-color:rgba(136,203,162,.34);background:rgba(136,203,162,.08);color:var(--green)}.card h2{margin:20px 0 8px;font-size:21px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.go{margin-top:auto;padding-top:22px;color:var(--sky);font-size:14px;font-weight:750}.settings .go{color:var(--green)}footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line2);color:var(--muted);font-size:13px;text-align:center}@media(max-width:700px){.shell{width:calc(100% - 32px);padding-top:40px}.hero{padding-top:20px}.hero h1{font-size:28px}.grid{grid-template-columns:1fr}.card{min-height:170px;padding:20px}}
</style>
</head>
<body><main class="shell"><section class="hero"><div class="eyebrow">MUFY TOOLS</div><h1>公开工具与设定</h1><p>一些可以直接使用、复制或修改的 MUFY 小工具与公开设定。</p></section><section class="grid"><a class="card" href="token.html"><span class="tag">工具</span><h2>MUFY Token统计器</h2><p>实时统计核心五项与开场设计 Token，支持直接编辑、折叠与一键复制。</p><span class="go">打开统计器 →</span></a><a class="card settings" href="settings.html"><span class="tag">公开设定</span><h2>公开设定</h2><p>状态栏、输出组件与其他可以直接复用的公开设定，统一从这里进入。</p><span class="go">查看设定列表 →</span></a></section><footer>@ez-owo</footer></main></body>
</html>
